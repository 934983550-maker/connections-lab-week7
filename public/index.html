<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aircraft Log</title>

  <style>
    body {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      color: #263244;
      background: #f5f6f8;
    }

    section {
      background: white;
      padding: 24px;
      margin: 20px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
    }

    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      font: inherit;
    }

    input, textarea {
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      margin-top: 18px;
      background: #334155;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .record {
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    #message {
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>Aircraft Log</h1>
  <p>A simple journal for recording the aircraft you spot.</p>

  <section>
    <h2>Add a new sighting</h2>

    <form id="sighting-form">
      <label for="aircraft">Aircraft model *</label>
      <input id="aircraft" name="aircraft"
        placeholder="e.g. Boeing 777-300ER" required>

      <label for="airport">Airport *</label>
      <input id="airport" name="airport"
        placeholder="e.g. Shenzhen Bao'an (SZX)" required>

      <label for="date">Date *</label>
      <input id="date" name="date" type="date" required>

      <label for="notes">Notes</label>
      <textarea id="notes" name="notes"
        placeholder="Write a short note"></textarea>

      <button type="submit">Save Sighting</button>
      <p id="message" role="status"></p>
    </form>
  </section>

  <section>
    <h2>Recent sightings</h2>
    <div id="sightings-list">Loading...</div>
  </section>

  <script>
    const form = document.querySelector("#sighting-form");
    const message = document.querySelector("#message");
    const list = document.querySelector("#sightings-list");
    const dateInput = document.querySelector("#date");

    dateInput.value = new Date().toLocaleDateString("en-CA");

    async function loadSightings() {
      try {
        const response = await fetch("/data");

        if (!response.ok) {
          throw new Error("Failed to load records.");
        }

        const sightings = await response.json();
        list.replaceChildren();

        if (sightings.length === 0) {
          list.textContent = "No sightings yet. Add your first one!";
          return;
        }

        sightings.forEach((item) => {
          const record = document.createElement("div");
          record.className = "record";

          const title = document.createElement("h3");
          title.textContent = item.aircraft;

          const details = document.createElement("p");
          details.textContent =
            item.airport + " · " + item.date;

          record.append(title, details);

          if (item.notes) {
            const notes = document.createElement("p");
            notes.textContent = item.notes;
            record.appendChild(notes);
          }

          list.appendChild(record);
        });
      } catch (error) {
        list.textContent = "Could not load records.";
        console.error(error);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const data = Object.fromEntries(new FormData(form).entries());

      try {
        const response = await fetch("/new-data", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Failed to save.");
        }

        message.textContent = result.message;
        form.reset();
        dateInput.value = new Date().toLocaleDateString("en-CA");
        await loadSightings();
      } catch (error) {
        message.textContent = error.message;
      }
    });

    loadSightings();
  </script>
</body>
</html>
